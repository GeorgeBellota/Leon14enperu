# ===========================================================================
#  COPIA DE REFERENCIA DEL VHOST DE PRODUCCIÓN
# ---------------------------------------------------------------------------
#  Esto NO es la fuente de verdad: la fuente de verdad es el archivo que hay
#  en el servidor, en /etc/nginx/sites-available/leon14enperu. Esta copia
#  vive en el repositorio para que el equipo pueda leer las reglas sin entrar
#  por SSH, y para que no vuelva a perderse: hasta hoy existía en una sola
#  carpeta de despliegue y se borró al limpiar el proyecto.
#
#  Si cambias algo en el servidor, actualiza también esta copia.
#
#  ── Lo que hay que saber antes de leerlo ─────────────────────────────────
#
#  Nginx no lee los .htaccess. Todo lo que en local resuelven los .htaccess
#  del proyecto, aquí está escrito a mano, y de forma más estricta: no hay
#  un «location ~ \.php$» genérico hacia FastCGI. Se declaran los CINCO
#  puntos de entrada reales y todo lo demás devuelve 404. Un .php subido al
#  servidor no se ejecuta, esté donde esté.
#
#      /index.php                  el sitio público entero
#      /ubigeo.php                 departamentos, provincias y distritos
#      /comunicado.php             las descargas del panel
#      /intranet/index.php         el redirector del panel
#      /intranet/public/index.php  el panel
#
#  Consecuencia práctica para quien desarrolla: si creas un .php nuevo,
#  funcionará en tu máquina con Apache y dará 404 en el servidor hasta que
#  alguien lo añada a esta lista. No es un fallo, es el diseño.
#
#  ── DOS COSAS PENDIENTES, anotadas el 05/09/2026 ─────────────────────────
#
#  Están marcadas abajo con «PENDIENTE». No las apliques a ciegas: léelas,
#  entiende qué cambian y hazlo con el servidor delante.
# ===========================================================================


# --- Puerto 80 -------------------------------------------------------------
# No redirige a HTTPS: lo hace Cloudflare con "Always Use HTTPS", en el nodo
# mas cercano al visitante. Duplicar la redireccion aqui provoca bucles.
server {
    listen 80;
    listen [::]:80;
    server_name leon14enperu.com www.leon14enperu.com;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name leon14enperu.com www.leon14enperu.com;

    root /var/www/leon14enperu;

    # index.html ya no existe: la raiz la resuelve el front controller.
    index index.php;

    # --- TLS ---------------------------------------------------------------
    # Origin Certificate de Cloudflare (valido hasta 2041). Solo lo reconoce
    # Cloudflare; no es un certificado publico.
    #
    # ssl_verify_client on exige el certificado de cliente de Cloudflare
    # (Authenticated Origin Pulls, modo Global). Si el sitio devuelve 400 de
    # forma masiva, revisar que ese toggle siga activo en el panel.
    ssl_certificate        /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key    /etc/ssl/cloudflare/origin.key;
    ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 24M y no 12M: la biblioteca de imagenes admite subidas de hasta 20 MB.
    # Con el tope por debajo, Nginx corta la peticion con un 413 antes de que
    # PHP llegue a ver el archivo, y el panel no puede dar un aviso util.
    client_max_body_size 24M;

    # ─────────────────────────────────────────────────────────────────────
    #  ⚠ PENDIENTE 1 · real_ip_header sin set_real_ip_from no hace nada
    # ─────────────────────────────────────────────────────────────────────
    #  La línea de abajo le dice a Nginx que confíe en la cabecera
    #  CF-Connecting-IP, pero Nginx sólo la acepta si la conexión viene de
    #  una dirección declarada de confianza con set_real_ip_from. Sin esa
    #  lista, la directiva se ignora y $remote_addr sigue siendo la IP del
    #  nodo de Cloudflare, no la del visitante.
    #
    #  Lo que rompe, hoy, en producción:
    #
    #    · El límite de 40 inscripciones por hora y por IP cuenta las de
    #      Cloudflare. Un nodo con mucho tráfico agota el cupo y bloquea a
    #      gente legítima; y quien quiera abusar sólo tiene que rotar de nodo.
    #    · La lista blanca del modo mantenimiento compara contra la IP del
    #      nodo. Se comprobó el 05/09: de catorce peticiones seguidas, unas
    #      pasaban y otras veían el aviso, según el nodo que atendiera.
    #    · Los registros de auditoría guardan la IP equivocada.
    #
    #  Para arreglarlo, delante de real_ip_header van los rangos de
    #  Cloudflare. La lista actual está en https://www.cloudflare.com/ips/
    #  y cambia de vez en cuando: conviene revisarla una vez al año.
    #
    #    include /etc/nginx/cloudflare-ips.conf;   # los set_real_ip_from
    #
    #  Comprobación después de aplicarlo: el access.log debe empezar a
    #  mostrar IPs de visitantes, no 162.159.x.x ni 172.68.x.x.
    # ─────────────────────────────────────────────────────────────────────

    # IP real del visitante en los logs, no la del nodo de Cloudflare
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/leon14enperu.access.log;
    error_log  /var/log/nginx/leon14enperu.error.log;

    error_page 404 /404.html;
    location = /404.html { }

    # --- Excepciones que si deben servirse ---------------------------------
    # Van con "=" o "^~" para ganar prioridad sobre las reglas de bloqueo.
    location ^~ /.well-known/        { }
    location = /robots.txt           { }
    location = /sitemap.xml          { }
    location = /favicon.svg          { }
    location = /favicon.ico          { }

    # --- 1 - Zonas cerradas ------------------------------------------------
    # ^~ corta la evaluacion de expresiones regulares: ningun location
    # posterior puede reabrir estas rutas.
    #
    # /views/ es NUEVO: ahi vive el marcado de todas las paginas. La lista
    # blanca ya impide que se ejecuten, pero sin esto se servirian como
    # texto plano y quedaria el sitio entero a la vista.
    location ^~ /views/             { return 404; }
    location ^~ /intranet/app/      { return 404; }
    location ^~ /intranet/config/   { return 404; }
    location ^~ /intranet/database/ { return 404; }
    location ^~ /intranet/storage/  { return 404; }
    location ^~ /intranet/almacen/  { return 404; }
    location ^~ /assets/parciales/  { return 404; }
    location ^~ /temporal-claude/   { return 404; }
    location ^~ /anterior-borrar/   { return 404; }
    location ^~ /despliegue/        { return 404; }

    # ─────────────────────────────────────────────────────────────────────
    #  ⚠ PENDIENTE 2 · /documentacion/ no está cerrada
    # ─────────────────────────────────────────────────────────────────────
    #  Hoy esa carpeta no se sube al servidor, así que no hay agujero. Pero
    #  la lista de extensiones bloqueadas de abajo NO incluye .html, y en
    #  documentacion/ vive arquitectura.html, que describe cada control de
    #  seguridad del sistema y dónde está. Si algún día alguien sube la
    #  carpeta entera por FTP, ese archivo se sirve.
    #
    #  Es una línea, y vale la pena tenerla puesta ANTES de que haga falta:
    #
    #    location ^~ /documentacion/ { return 404; }
    # ─────────────────────────────────────────────────────────────────────

    # Extensiones que nunca se sirven, esten donde esten
    location ~* \.(md|sql|zip|tar|gz|log|bak|ini|sh|dist|example|txt|PRODUCCION)$ {
        return 404;
    }

    # Archivos ocultos (.env, .git, .htaccess)
    location ~ /\. { return 404; }

    # --- 2 - Subidas del panel ---------------------------------------------
    # Sustituye a assets/subidos/comunicados/.htaccess (php_flag engine off).
    # Aqui escribe el panel lo que suben los administradores: se sirve, pero
    # nada de lo que entre puede ejecutarse.
    location ^~ /assets/subidos/ {
        location ~ \.(php|phtml|phar|cgi|pl|py|sh)$ { return 404; }
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- 3 - Puntos de entrada PHP - LISTA BLANCA --------------------------
    # Lo que no este declarado aqui no se ejecuta. Nunca.
    #
    # Pasan de 22 a 3 (mas el panel): el sitio publico tiene ahora un unico
    # punto de entrada y las paginas viven en views/, sin index.php propio.
    location = /index.php               { include snippets/php-leon14.conf; }
    location = /ubigeo.php              { include snippets/php-leon14.conf; }
    location = /comunicado.php          { include snippets/php-leon14.conf; }
    location = /intranet/index.php      { include snippets/php-leon14.conf; }

    # Direcciones antiguas del tipo /voluntariado/index.php.
    #
    # Ya no existen como archivo, pero pueden estar en un marcador o en un
    # enlace compartido: se trasladan a la direccion buena en vez de morir
    # en un 404. $canonicalizar (map en nginx.conf) vale 1 solo si el
    # navegador pidio literalmente .../index.php con GET, de modo que un
    # POST nunca se convierte en redireccion y no se pierde ningun envio.
    location ~ ^/([a-z0-9-]+)/index\.php$ {
        if ($canonicalizar) { return 301 /$1/; }
        return 404;
    }

    # Red de seguridad: cualquier otro .php muere aqui
    location ~ \.php$ { return 404; }

    # --- 4 - Panel ---------------------------------------------------------
    location = /intranet  { return 301 /intranet/; }
    location = /intranet/ {
        include snippets/php-leon14.conf;
        fastcgi_param SCRIPT_FILENAME $document_root/intranet/index.php;
    }

    location ^~ /intranet/public/ {
        location ~ ^/intranet/public/(.+)/$ { return 301 /intranet/public/$1; }

        try_files $uri $uri/ /intranet/public/index.php?$query_string;

        location = /intranet/public/index.php {
            include snippets/php-leon14.conf;
        }

        location ~ \.php$ { return 404; }
    }

    # --- 5 - Sitio publico -------------------------------------------------
    # Direcciones antiguas .html -> nuevas, 301 permanente
    location = /index.html           { return 301 /; }
    location ~ ^/([a-z0-9-]+)\.html$ { return 301 /$1/; }

    # Cache: el HTML cambia al publicar una noticia, no se cachea.
    location ~* \.html$ {
        expires 0;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # CSS y JS: 1 hora mientras el sitio este en construccion.
    # Subir a 1y cuando todos los assets esten versionados con ?v=<hash>.
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cabeceras de seguridad. add_header NO se hereda en Nginx: si un
    # location define cabeceras propias, descarta las del padre. Por eso
    # se repiten arriba donde hace falta.
    #
    # Las paginas HTML reciben ademas CSP, HSTS y Permissions-Policy desde
    # PHP (Publico/arranque.php), que llegan a todas por igual. Estas de
    # aqui cubren los archivos estaticos, que no pasan por PHP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # El sitio publico tiene ahora un front controller unico: lo que no sea
    # un archivo o una carpeta real lo resuelve index.php contra el mapa de
    # Publico\Rutas.
    #
    # ANTES era "=404", porque cada seccion era su propio index.php. Con
    # aquello, ninguna direccion llegaria al router y todas las paginas
    # devolverian 404.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
